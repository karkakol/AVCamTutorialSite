<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270">
  <title>The four stages of a recording: the start request, the recording, the stop request, and the delegate callback that completes the file</title>
  <defs>
    <marker id="ch10-timeline-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/>
    </marker>
  </defs>
  <g font-family="inherit" font-size="14" text-anchor="middle">
    <rect x="10" y="20" width="158" height="84" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
    <text x="89" y="46" fill="currentColor" font-weight="600">1. Start</text>
    <text x="89" y="68" fill="var(--muted)" font-size="13">startRecording(to:…)</text>
    <text x="89" y="88" fill="var(--muted)" font-size="13">returns immediately</text>

    <rect x="191" y="20" width="158" height="84" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
    <text x="270" y="46" fill="currentColor" font-weight="600">2. Record</text>
    <text x="270" y="68" fill="var(--muted)" font-size="13">the output writes</text>
    <text x="270" y="88" fill="var(--muted)" font-size="13">video and audio</text>

    <rect x="372" y="20" width="158" height="84" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
    <text x="451" y="46" fill="currentColor" font-weight="600">3. Stop</text>
    <text x="451" y="68" fill="var(--muted)" font-size="13">stopRecording()</text>
    <text x="451" y="88" fill="var(--muted)" font-size="13">returns immediately</text>

    <rect x="553" y="20" width="157" height="84" rx="10" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>
    <text x="631" y="46" fill="currentColor" font-weight="600">4. Finish</text>
    <text x="631" y="68" fill="var(--muted)" font-size="13">didFinishRecordingTo</text>
    <text x="631" y="88" fill="var(--muted)" font-size="13">the file is complete</text>

    <rect x="191" y="160" width="158" height="84" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="270" y="186" fill="currentColor" font-weight="600">Timer</text>
    <text x="270" y="208" fill="var(--muted)" font-size="13">reads recordedDuration</text>
    <text x="270" y="228" fill="var(--muted)" font-size="13">four times each second</text>

    <rect x="372" y="160" width="158" height="84" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="451" y="186" fill="currentColor" font-weight="600">Continuation</text>
    <text x="451" y="208" fill="var(--muted)" font-size="13">the caller waits</text>
    <text x="451" y="228" fill="var(--muted)" font-size="13">for the movie</text>
  </g>
  <g stroke="var(--muted)" stroke-width="1.5" fill="none" marker-end="url(#ch10-timeline-arrow)">
    <path d="M168 62 H189"/>
    <path d="M349 62 H370"/>
    <path d="M530 62 H551"/>
    <path d="M270 158 V106" stroke-dasharray="5 4"/>
    <path d="M451 106 V158" stroke-dasharray="5 4"/>
    <path d="M530 202 H631 V106" stroke-dasharray="5 4"/>
  </g>
</svg>
