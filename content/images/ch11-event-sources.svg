<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350">
  <title>Which hardware control sends which capture event: four controls send a primary event, the volume up button sends a secondary event, and AVCam handles the two kinds in one closure</title>
  <defs>
    <marker id="ch11-sources-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/>
    </marker>
  </defs>
  <g font-family="inherit" font-size="14" text-anchor="middle">
    <text x="125" y="20" fill="var(--muted)" font-size="13">Hardware control</text>
    <text x="400" y="20" fill="var(--muted)" font-size="13">Capture event</text>
    <text x="625" y="20" fill="var(--muted)" font-size="13">AVCam</text>

    <rect x="20" y="34" width="210" height="40" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
    <text x="125" y="59" fill="currentColor">Volume down button</text>

    <rect x="20" y="88" width="210" height="40" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
    <text x="125" y="113" fill="currentColor">Action button</text>

    <rect x="20" y="142" width="210" height="40" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
    <text x="125" y="167" fill="currentColor">Camera Control, full press</text>

    <rect x="20" y="196" width="210" height="40" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
    <text x="125" y="221" fill="currentColor">AirPods stem click</text>

    <rect x="20" y="276" width="210" height="40" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
    <text x="125" y="301" fill="currentColor">Volume up button</text>

    <rect x="320" y="98" width="160" height="74" rx="10" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>
    <text x="400" y="130" fill="currentColor" font-weight="600">Primary event</text>
    <text x="400" y="152" fill="var(--muted)" font-size="13">the shutter</text>

    <rect x="320" y="259" width="160" height="74" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
    <text x="400" y="291" fill="currentColor" font-weight="600">Secondary event</text>
    <text x="400" y="313" fill="var(--muted)" font-size="13">a second function</text>

    <text x="412" y="212" fill="var(--muted)" font-size="13" text-anchor="start">no secondary</text>
    <text x="412" y="230" fill="var(--muted)" font-size="13" text-anchor="start">handler</text>

    <rect x="560" y="150" width="140" height="130" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
    <text x="630" y="188" fill="currentColor" font-weight="600">One closure</text>
    <text x="630" y="212" fill="var(--muted)" font-size="13">photo mode:</text>
    <text x="630" y="230" fill="var(--muted)" font-size="13">take a photo</text>
    <text x="630" y="252" fill="var(--muted)" font-size="13">video mode: start</text>
    <text x="630" y="270" fill="var(--muted)" font-size="13">or stop a movie</text>
  </g>
  <g stroke="var(--muted)" stroke-width="1.5" fill="none" marker-end="url(#ch11-sources-arrow)">
    <path d="M230 54 L318 112"/>
    <path d="M230 108 L318 126"/>
    <path d="M230 162 L318 144"/>
    <path d="M230 216 L318 158"/>
    <path d="M230 296 L318 296"/>
    <path d="M480 135 L558 190"/>
    <path d="M480 296 L558 240"/>
  </g>
  <path d="M400 259 L400 174" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#ch11-sources-arrow)"/>
</svg>
