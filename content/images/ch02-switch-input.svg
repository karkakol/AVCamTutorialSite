<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250">
  <title>The four operations of a camera switch, and the fallback when the new input fails</title>
  <defs>
    <marker id="ch02-switch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/>
    </marker>
  </defs>
  <g font-family="inherit" font-size="14" text-anchor="middle">
    <rect x="10" y="50" width="155" height="64" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
    <text x="87" y="78" fill="currentColor" font-weight="600">1. Begin</text>
    <text x="87" y="98" fill="var(--muted)" font-size="13">beginConfiguration()</text>

    <rect x="191" y="50" width="155" height="64" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
    <text x="268" y="78" fill="currentColor" font-weight="600">2. Remove</text>
    <text x="268" y="98" fill="var(--muted)" font-size="13">the old input</text>

    <rect x="372" y="50" width="155" height="64" rx="10" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>
    <text x="449" y="78" fill="currentColor" font-weight="600">3. Add</text>
    <text x="449" y="98" fill="var(--muted)" font-size="13">the new input</text>

    <rect x="553" y="50" width="157" height="64" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
    <text x="631" y="78" fill="currentColor" font-weight="600">4. Commit</text>
    <text x="631" y="98" fill="var(--muted)" font-size="13">commitConfiguration()</text>

    <rect x="342" y="170" width="214" height="64" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="449" y="198" fill="currentColor" font-weight="600">If step 3 fails</text>
    <text x="449" y="218" fill="var(--muted)" font-size="13">add the old input again</text>

    <text x="360" y="28" fill="var(--muted)" font-size="13">The session applies steps 2 and 3 together when step 4 runs</text>
  </g>
  <g stroke="var(--muted)" stroke-width="1.5" fill="none" marker-end="url(#ch02-switch-arrow)">
    <path d="M165 82 H189"/>
    <path d="M346 82 H370"/>
    <path d="M527 82 H551"/>
    <path d="M449 114 V168" stroke-dasharray="5 4"/>
    <path d="M556 202 H631 V116" stroke-dasharray="5 4"/>
  </g>
</svg>
