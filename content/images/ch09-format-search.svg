<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360">
  <title>How activeFormat10BitVariant searches the format list: it keeps the formats with the size and the maximum frame rate of the active format, and returns the first 10-bit format of these</title>
  <g font-family="inherit" font-size="13" fill="var(--muted)">
    <text x="36" y="34">Size</text>
    <text x="186" y="34">Maximum rate</text>
    <text x="316" y="34">Pixel format</text>
    <text x="452" y="34">What the search does</text>
  </g>
  <g fill="var(--surface)" stroke="var(--line)" stroke-width="1.5">
    <rect x="20" y="48" width="410" height="40" rx="8"/>
    <rect x="20" y="96" width="410" height="40" rx="8"/>
    <rect x="20" y="144" width="410" height="40" rx="8"/>
    <rect x="20" y="192" width="410" height="40" rx="8" stroke="var(--accent)" stroke-width="2"/>
    <rect x="20" y="240" width="410" height="40" rx="8"/>
    <rect x="20" y="288" width="410" height="40" rx="8"/>
  </g>
  <g font-family="inherit" font-size="14" fill="currentColor">
    <text x="36" y="73">1280 x 720</text>
    <text x="186" y="73">30</text>
    <text x="316" y="73">420v</text>

    <text x="36" y="121" font-weight="600">1920 x 1080</text>
    <text x="186" y="121" font-weight="600">30</text>
    <text x="316" y="121" font-weight="600">420v</text>

    <text x="36" y="169">1920 x 1080</text>
    <text x="186" y="169">30</text>
    <text x="316" y="169">420f</text>

    <text x="36" y="217" font-weight="600">1920 x 1080</text>
    <text x="186" y="217" font-weight="600">30</text>
    <text x="316" y="217" font-weight="600" fill="var(--accent)">x420</text>

    <text x="36" y="265">1920 x 1080</text>
    <text x="186" y="265">60</text>
    <text x="316" y="265">420v</text>

    <text x="36" y="313">3840 x 2160</text>
    <text x="186" y="313">30</text>
    <text x="316" y="313">x420</text>
  </g>
  <g font-family="inherit" font-size="13" fill="var(--muted)">
    <text x="452" y="73">Removed: different size</text>
    <text x="452" y="121" fill="currentColor" font-weight="600">The active format (8-bit)</text>
    <text x="452" y="169">Kept, but not 10-bit</text>
    <text x="452" y="217" fill="var(--accent)" font-weight="600">Kept, first 10-bit: the result</text>
    <text x="452" y="265">Removed: different rate</text>
    <text x="452" y="313">Removed: different size</text>
  </g>
  <text x="20" y="350" font-family="inherit" font-size="13" fill="var(--muted)">An example list. A real camera has many more formats, and the values depend on the device.</text>
</svg>
