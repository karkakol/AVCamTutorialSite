<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 345">
  <title>The Camera Control changes the controls of the capture session. The system sliders set a device property themselves, a custom slider calls your action, and the controls delegate receives four callbacks.</title>
  <defs>
    <marker id="ch12-controls-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/>
    </marker>
  </defs>
  <g font-family="inherit" font-size="14" text-anchor="middle">
    <rect x="15" y="105" width="140" height="80" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
    <text x="85" y="140" fill="currentColor" font-weight="600">Camera Control</text>
    <text x="85" y="161" fill="var(--muted)" font-size="13">light press, slide</text>

    <rect x="200" y="20" width="240" height="235" rx="10" fill="none" stroke="var(--accent)" stroke-width="2"/>
    <text x="320" y="45" fill="currentColor" font-weight="600">Capture session</text>
    <text x="320" y="63" fill="var(--muted)" font-size="13">its controls</text>

    <rect x="215" y="75" width="210" height="44" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
    <text x="320" y="102" fill="currentColor">System zoom slider</text>
    <rect x="215" y="133" width="210" height="44" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
    <text x="320" y="160" fill="currentColor">System exposure bias slider</text>
    <rect x="215" y="191" width="210" height="44" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
    <text x="320" y="218" fill="currentColor">Custom slider (lens position)</text>

    <rect x="565" y="20" width="140" height="235" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
    <text x="635" y="45" fill="currentColor" font-weight="600">Camera device</text>
    <g fill="currentColor" font-size="13">
      <text x="635" y="102">videoZoomFactor</text>
      <text x="635" y="160">exposureTargetBias</text>
      <text x="635" y="218">lensPosition</text>
    </g>

    <g fill="var(--muted)" font-size="13">
      <text x="495" y="90">the system sets it</text>
      <text x="495" y="148">the system sets it</text>
      <text x="495" y="206">your action sets it</text>
    </g>

    <rect x="200" y="290" width="240" height="44" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
    <text x="320" y="317" fill="currentColor" font-weight="600">Controls delegate</text>
    <text x="455" y="317" fill="var(--muted)" font-size="13" text-anchor="start">four callbacks on your serial queue</text>
  </g>
  <g stroke="var(--muted)" stroke-width="1.5" fill="none" marker-end="url(#ch12-controls-arrow)">
    <path d="M155 145 L198 145"/>
    <path d="M425 97 L563 97"/>
    <path d="M425 155 L563 155"/>
    <path d="M425 213 L563 213"/>
    <path d="M320 255 L320 288"/>
  </g>
</svg>
