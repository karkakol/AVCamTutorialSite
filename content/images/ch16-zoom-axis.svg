<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280">
  <title>One zoom axis of a triple camera, with the device values above the axis and the display values below it. The values are an example.</title>
  <defs>
    <marker id="ch16-axis-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/>
    </marker>
  </defs>
  <g font-family="inherit" font-size="14" text-anchor="middle">
    <text x="20" y="24" fill="var(--muted)" font-size="13" text-anchor="start">Example: a triple camera with the switch-over zoom factors 2 and 6 and a display multiplier of 0.5</text>

    <text x="385" y="56" fill="var(--muted)" font-size="13">Switch-over zoom factors</text>

    <text x="20" y="92" fill="currentColor" font-size="13" text-anchor="start">Device value</text>
    <g fill="currentColor" font-weight="600">
      <text x="170" y="92">1.0</text>
      <text x="290" y="92">2.0</text>
      <text x="480" y="92">6.0</text>
      <text x="686" y="92">20.0</text>
    </g>

    <rect x="170" y="104" width="120" height="44" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
    <rect x="290" y="104" width="190" height="44" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
    <rect x="480" y="104" width="209" height="44" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
    <text x="230" y="131" fill="currentColor">Ultra-wide</text>
    <text x="385" y="131" fill="currentColor">Wide</text>
    <text x="584" y="131" fill="currentColor">Telephoto</text>

    <text x="20" y="174" fill="currentColor" font-size="13" text-anchor="start">Display value</text>
    <g fill="currentColor" font-weight="600">
      <text x="170" y="174">0.5×</text>
      <text x="290" y="174" fill="var(--accent)">1×</text>
      <text x="480" y="174">3×</text>
      <text x="686" y="174">10×</text>
    </g>

    <g font-size="13">
      <text x="170" y="222" fill="var(--muted)">Widest view</text>
      <text x="290" y="222" fill="var(--accent)" font-weight="600">The app starts here</text>
      <text x="700" y="222" fill="var(--muted)" text-anchor="end">Limit of this app</text>
      <text x="20" y="258" fill="var(--muted)" text-anchor="start">Display value = device value × display multiplier. Inside each part, a larger zoom is a smaller crop.</text>
    </g>
  </g>
  <g stroke="var(--line)" stroke-width="1.5" fill="none">
    <path d="M170 182 L170 206"/>
    <path d="M689 182 L689 206"/>
  </g>
  <path d="M290 182 L290 206" stroke="var(--accent)" stroke-width="2" fill="none"/>
  <path d="M290 104 L290 148" stroke="var(--accent)" stroke-width="2.5" fill="none"/>
  <g stroke="var(--muted)" stroke-width="1.5" fill="none" marker-end="url(#ch16-axis-arrow)">
    <path d="M340 62 L300 78"/>
    <path d="M430 62 L470 78"/>
  </g>
</svg>
