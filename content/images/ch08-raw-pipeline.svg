<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360">
  <title>One capture request for Apple ProRAW with no processed format gives one photo: a DNG file with a full-size JPEG preview inside. The delegate gets one call. The app saves the DNG alone as the photo resource of one asset in the Photos library.</title>
  <defs>
    <marker id="ch08-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/>
    </marker>
    <marker id="ch08-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
    </marker>
  </defs>

  <!-- Column titles -->
  <g font-family="inherit" font-size="13" fill="var(--muted)" text-anchor="middle">
    <text x="62" y="24">The camera</text>
    <text x="226" y="24">One request</text>
    <text x="434" y="24">One photo</text>
    <text x="630" y="24">What the app saves</text>
  </g>

  <!-- Sensor -->
  <rect x="12" y="120" width="100" height="120" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
  <g font-family="inherit" text-anchor="middle">
    <text x="62" y="170" font-size="14" font-weight="600" fill="currentColor">Sensor</text>
    <text x="62" y="192" font-size="13" fill="var(--muted)">one image</text>
  </g>

  <!-- Request -->
  <rect x="142" y="110" width="168" height="140" rx="10" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>
  <g font-family="inherit" text-anchor="middle">
    <text x="226" y="140" font-size="14" font-weight="600" fill="currentColor">capturePhoto</text>
    <text x="226" y="166" font-size="13" fill="var(--muted)">Apple ProRAW format</text>
    <text x="226" y="186" font-size="13" fill="var(--muted)">processedFormat: nil</text>
    <text x="226" y="212" font-size="13" fill="var(--muted)">+ full-size JPEG</text>
    <text x="226" y="230" font-size="13" fill="var(--muted)">preview in the DNG</text>
  </g>

  <!-- One output -->
  <rect x="346" y="120" width="176" height="120" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
  <g font-family="inherit" text-anchor="middle">
    <text x="434" y="150" font-size="14" font-weight="600" fill="currentColor">RAW photo</text>
    <text x="434" y="174" font-size="13" fill="var(--muted)">DNG data</text>
    <text x="434" y="194" font-size="13" fill="var(--muted)">with its preview</text>
    <text x="434" y="220" font-size="13" fill="var(--muted)">one call</text>
  </g>

  <!-- One asset -->
  <rect x="556" y="96" width="152" height="168" rx="10" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>
  <g font-family="inherit" text-anchor="middle">
    <text x="632" y="126" font-size="14" font-weight="600" fill="currentColor">One asset</text>
    <text x="632" y="150" font-size="13" fill="var(--muted)">in Photos</text>
    <text x="632" y="184" font-size="13" fill="currentColor">.photo</text>
    <text x="632" y="202" font-size="13" fill="var(--muted)">the DNG alone</text>
    <text x="632" y="228" font-size="13" fill="var(--muted)">a .dng file,</text>
    <text x="632" y="246" font-size="13" fill="var(--muted)">shouldMoveFile</text>
  </g>

  <!-- Arrows -->
  <g fill="none" stroke-width="1.5">
    <path d="M114 180 H138" stroke="var(--muted)" marker-end="url(#ch08-arrow)"/>
    <path d="M312 180 H342" stroke="var(--muted)" marker-end="url(#ch08-arrow)"/>
    <path d="M524 180 H552" stroke="var(--accent)" stroke-width="2" marker-end="url(#ch08-arrow-accent)"/>
  </g>

  <!-- Footer -->
  <g font-family="inherit" font-size="13" fill="var(--muted)">
    <text x="12" y="336">The delegate keeps the DNG in photoData and sets isRAW. It reports once, at the end.</text>
  </g>
</svg>
