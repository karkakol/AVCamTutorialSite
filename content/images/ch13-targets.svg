<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300">
  <title>The three targets and the source files of each target: 25 files are in the app and the capture extension, 3 files are in all targets, and each target has its own entry point</title>
  <g fill="var(--surface)" stroke="var(--line)" stroke-width="1.5">
    <rect x="20" y="16" width="200" height="48" rx="10"/>
    <rect x="260" y="16" width="200" height="48" rx="10"/>
    <rect x="500" y="16" width="200" height="48" rx="10"/>
  </g>
  <g font-family="inherit" font-size="15" font-weight="600" fill="currentColor" text-anchor="middle">
    <text x="120" y="45">AVCam app</text>
    <text x="360" y="45">Capture extension</text>
    <text x="600" y="45">Control extension</text>
  </g>
  <g stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 4">
    <path d="M240 76 V288"/>
    <path d="M480 76 V288"/>
  </g>
  <g fill="var(--surface)" stroke="var(--line)" stroke-width="1.5">
    <rect x="20" y="88" width="200" height="48" rx="8"/>
    <rect x="260" y="88" width="200" height="48" rx="8"/>
    <rect x="500" y="88" width="200" height="48" rx="8"/>
    <rect x="20" y="156" width="440" height="48" rx="8"/>
    <rect x="20" y="224" width="680" height="56" rx="8" stroke="var(--accent)" stroke-width="2"/>
  </g>
  <g font-family="inherit" font-size="13" fill="currentColor" text-anchor="middle">
    <text x="120" y="108">AVCamApp.swift</text>
    <text x="360" y="108">AVCamCaptureExtension.swift</text>
    <text x="600" y="108">The control and its bundle</text>
    <text x="240" y="176">25 files: the model, the capture service, and the views</text>
    <text x="360" y="246">3 files: CameraState.swift, DataTypes.swift, AVCamCaptureIntent.swift</text>
  </g>
  <g font-family="inherit" font-size="13" fill="var(--muted)" text-anchor="middle">
    <text x="120" y="126">the entry point of the app</text>
    <text x="360" y="126">the entry point</text>
    <text x="600" y="126">2 files, the entry point</text>
    <text x="240" y="194">shared by two targets</text>
    <text x="360" y="266">shared by all targets</text>
  </g>
</svg>
