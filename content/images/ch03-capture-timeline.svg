<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 486">
  <title>The life cycle of one photo capture: the delegate callbacks in order, and what AVCam does in each callback</title>
  <g font-family="inherit" font-size="13" fill="var(--muted)">
    <text x="56" y="24">Callback</text>
    <text x="392" y="24">What AVCam does</text>
  </g>
  <!-- The time axis -->
  <path d="M32 70 V410" stroke="var(--line)" stroke-width="2" fill="none"/>
  <g stroke-width="2">
    <circle cx="32" cy="70" r="7" fill="var(--surface)" stroke="var(--muted)"/>
    <circle cx="32" cy="138" r="7" fill="var(--accent)" stroke="var(--accent)"/>
    <circle cx="32" cy="206" r="7" fill="var(--surface)" stroke="var(--muted)"/>
    <circle cx="32" cy="274" r="7" fill="var(--surface)" stroke="var(--muted)"/>
    <circle cx="32" cy="342" r="7" fill="var(--surface)" stroke="var(--muted)"/>
    <circle cx="32" cy="410" r="7" fill="var(--accent)" stroke="var(--accent)"/>
  </g>
  <!-- The callbacks -->
  <g font-family="inherit" font-size="15" font-weight="600" fill="currentColor">
    <text x="56" y="66">capturePhoto(with:delegate:)</text>
    <text x="56" y="134">willBeginCaptureFor</text>
    <text x="56" y="202">willCapturePhotoFor</text>
    <text x="56" y="270">didCapturePhotoFor</text>
    <text x="56" y="338">didFinishProcessingPhoto</text>
    <text x="56" y="406">didFinishCaptureFor</text>
  </g>
  <g font-family="inherit" font-size="13" fill="var(--muted)">
    <text x="56" y="86">Your code starts the request.</text>
    <text x="56" y="154">Always first. The settings are resolved.</text>
    <text x="56" y="222">The exposure starts. The shutter sound plays.</text>
    <text x="56" y="290">The exposure ends.</text>
    <text x="56" y="358">An image is ready. Can arrive more than once.</text>
    <text x="56" y="426">Always last. Also arrives after an error.</text>
  </g>
  <!-- What AVCam does -->
  <g fill="var(--surface)" stroke="var(--line)" stroke-width="1.5">
    <rect x="380" y="46" width="324" height="48" rx="8"/>
    <rect x="380" y="114" width="324" height="48" rx="8"/>
    <rect x="380" y="182" width="324" height="48" rx="8" stroke="var(--accent)" stroke-width="2"/>
    <rect x="380" y="250" width="324" height="48" rx="8" stroke-dasharray="5 4"/>
    <rect x="380" y="318" width="324" height="48" rx="8"/>
    <rect x="380" y="386" width="324" height="48" rx="8" stroke="var(--accent)" stroke-width="2"/>
  </g>
  <g font-family="inherit" font-size="13" fill="currentColor">
    <text x="394" y="75">Makes new settings and a new delegate.</text>
    <text x="394" y="143">Yields .photoCapture() to the activity stream.</text>
    <text x="394" y="202">Yields .photoCapture(willCapture: true).</text>
    <text x="394" y="220">The screen flashes.</text>
    <text x="394" y="279" fill="var(--muted)">Not implemented.</text>
    <text x="394" y="347">Keeps the file data of the photo.</text>
    <text x="394" y="406">Finishes the activity stream.</text>
    <text x="394" y="424">Resumes the continuation one time.</text>
  </g>
  <g font-family="inherit" font-size="13" fill="var(--muted)">
    <circle cx="32" cy="462" r="6" fill="var(--accent)"/>
    <text x="56" y="466">Fixed position. The order of the callbacks between the first and the last is not guaranteed.</text>
  </g>
</svg>
