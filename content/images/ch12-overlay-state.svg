<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 215">
  <title>The fullscreen state of the controls goes from the controls delegate through the capture service to the model, and four views read it to set their opacity.</title>
  <defs>
    <marker id="ch12-overlay-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/>
    </marker>
  </defs>
  <g font-family="inherit" font-size="14" text-anchor="middle">
    <text x="20" y="28" fill="currentColor" font-size="13" text-anchor="start">The system calls "will enter" and "will exit" the fullscreen appearance</text>

    <rect x="15" y="70" width="150" height="70" rx="10" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>
    <text x="90" y="100" fill="currentColor" font-weight="600">Controls delegate</text>
    <text x="90" y="121" fill="var(--muted)" font-size="13">sets a Boolean value</text>

    <rect x="195" y="70" width="150" height="70" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
    <text x="270" y="100" fill="currentColor" font-weight="600">CaptureService</text>
    <text x="270" y="121" fill="var(--muted)" font-size="13">publishes it again</text>

    <rect x="375" y="70" width="150" height="70" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
    <text x="450" y="100" fill="currentColor" font-weight="600">CameraModel</text>
    <text x="450" y="121" fill="var(--muted)" font-size="13">prefersMinimizedUI</text>

    <rect x="555" y="70" width="150" height="70" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
    <text x="630" y="100" fill="currentColor" font-weight="600">Four views</text>
    <text x="630" y="121" fill="var(--muted)" font-size="13">opacity 0 or 1</text>

    <g fill="var(--muted)" font-size="13">
      <text x="180" y="190">session queue</text>
      <text x="540" y="190">main actor</text>
    </g>
  </g>
  <g stroke="var(--line)" stroke-width="1.5" fill="none">
    <path d="M15 160 L15 168 L345 168 L345 160"/>
    <path d="M375 160 L375 168 L705 168 L705 160"/>
  </g>
  <g stroke="var(--muted)" stroke-width="1.5" fill="none" marker-end="url(#ch12-overlay-arrow)">
    <path d="M90 38 L90 68"/>
    <path d="M165 105 L193 105"/>
    <path d="M345 105 L373 105"/>
    <path d="M525 105 L553 105"/>
  </g>
</svg>
