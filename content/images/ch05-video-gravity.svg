<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290">
  <title>The three video gravity values: fit with bars, fill with a crop, and stretch</title>

  <!-- .resizeAspect: all of the image, bars above and below -->
  <rect x="65" y="20" width="110" height="196" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
  <rect x="65" y="45" width="110" height="147" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="2"/>
  <circle cx="120" cy="118" r="34" fill="none" stroke="var(--accent)" stroke-width="1.5"/>

  <!-- .resizeAspectFill: the layer is full, the sides of the image are cut -->
  <rect x="286" y="20" width="148" height="196" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="305" y="20" width="110" height="196" fill="var(--accent)" fill-opacity="0.16" stroke="var(--line)" stroke-width="2"/>
  <circle cx="360" cy="118" r="45" fill="none" stroke="var(--accent)" stroke-width="1.5"/>

  <!-- .resize: the image is stretched -->
  <rect x="545" y="20" width="110" height="196" fill="var(--accent)" fill-opacity="0.16" stroke="var(--line)" stroke-width="2"/>
  <ellipse cx="600" cy="118" rx="34" ry="45" fill="none" stroke="var(--accent)" stroke-width="1.5"/>

  <g font-family="inherit" font-size="14" text-anchor="middle">
    <text x="120" y="244" fill="currentColor" font-weight="600">.resizeAspect</text>
    <text x="120" y="264" fill="var(--muted)" font-size="13">All of the image.</text>
    <text x="120" y="281" fill="var(--muted)" font-size="13">Bars fill the layer.</text>

    <text x="360" y="244" fill="currentColor" font-weight="600">.resizeAspectFill</text>
    <text x="360" y="264" fill="var(--muted)" font-size="13">No bars.</text>
    <text x="360" y="281" fill="var(--muted)" font-size="13">The edges are cut.</text>

    <text x="600" y="244" fill="currentColor" font-weight="600">.resize</text>
    <text x="600" y="264" fill="var(--muted)" font-size="13">No bars, no cut.</text>
    <text x="600" y="281" fill="var(--muted)" font-size="13">The shapes are wrong.</text>
  </g>
</svg>
